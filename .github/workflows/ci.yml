# Integración continua: lint + pruebas unitarias + build de la imagen.
# GitHub Flow: corre en cada push a una rama feature/* y en cada Pull Request a main.
# El workflow de despliegue (deploy.yml) también lo reutiliza antes de desplegar.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Pruebas unitarias (pytest)
        run: pytest

  docker-build:
    name: Build de imagen Docker
    needs: test
    # En main la imagen se construye y publica en deploy.yml; aquí solo se valida.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
