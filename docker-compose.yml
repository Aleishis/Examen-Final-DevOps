# Entorno de desarrollo local: app Flask + MySQL.
#   docker compose up --build
services:
  web:
    build: .
    command: python main.py
    env_file: .env
    environment:
      FLASK_DEBUG: "1"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    env_file: .env
    ports:
      # si no les funciona puede ser por puerto, intenen cambiarlo por uno que no este en uso
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  uploads:
