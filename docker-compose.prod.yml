# Producción en la VM de Azure. El pipeline lo copia a la VM y define IMAGE_TAG
#   IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d
services:
  web:
    image: ghcr.io/aleishis/examen-final-devops:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "80:8000"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    # Sin puerto publicado: MySQL solo es accesible por la red privada de Docker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  uploads:
